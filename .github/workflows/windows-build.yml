name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the zip to the public "windows-latest" release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (MSVC, via build.bat)
        shell: pwsh
        run: |
          cmd /c "build.bat > build.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content build.log -Tail 150
          if ($code -ne 0) {
            # Surface the compiler errors as annotations + job summary, so they
            # can be read without downloading the raw logs.
            $errs = Select-String -Path build.log -Pattern 'error|LINK :|fatal' |
                    Select-Object -First 12
            foreach ($e in $errs) {
              Write-Host ("::error title=MSVC build::{0}" -f $e.Line)
            }
            $fence = '```'
            Add-Content $env:GITHUB_STEP_SUMMARY "### MSVC build failed (exit $code)"
            Add-Content $env:GITHUB_STEP_SUMMARY $fence
            Select-String -Path build.log -Pattern 'error|LINK|fatal' |
              Select-Object -First 80 |
              ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY $_.Line }
            Add-Content $env:GITHUB_STEP_SUMMARY $fence
            exit $code
          }

      - name: Install FFmpeg for smoke test
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Smoke test (unicode + apostrophe file name, fake keys)
        shell: pwsh
        run: |
          $env:Path = "C:\ProgramData\chocolatey\bin;" + $env:Path
          New-Item -ItemType Directory -Force smoke\movies | Out-Null
          Copy-Item build\Release\movie_summary_cli.exe smoke\
          Copy-Item -Recurse resources smoke\resources
          '{"open_api_key":"sk-fake","elevenlabs_api_key":"el-fake"}' | Set-Content smoke\config.json
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=640x360:duration=5 -c:v libx264 "smoke\movies\Amélie's Test (2001).mp4"
          Push-Location smoke
          .\movie_summary_cli.exe 2>&1 | Tee-Object -FilePath ..\smoke.log
          $rc = $LASTEXITCODE
          Pop-Location
          Write-Host "exit code: $rc"
          if ($rc -ne 0) { throw "CLI returned $rc" }
          if (-not (Select-String -Path smoke.log -Pattern "Processing: Amélie's Test \(2001\)" -Quiet)) { throw "unicode movie was not picked up" }
          if (-not (Select-String -Path smoke.log -Pattern "All done" -Quiet)) { throw "run did not finish" }

      - name: Test the portable FFmpeg lookup (nothing on PATH)
        shell: pwsh
        run: |
          # This is what makes the F: install work: run.bat drops ffmpeg.exe next to
          # the project instead of editing the system PATH, so the app has to find it.
          $real = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter ffmpeg.exe |
                  Select-Object -First 1
          if (-not $real) { throw "could not locate chocolatey's ffmpeg.exe to copy" }
          $probe = Join-Path $real.DirectoryName "ffprobe.exe"
          if (-not (Test-Path $probe)) { throw "ffprobe.exe is not next to ffmpeg.exe" }

          New-Item -ItemType Directory -Force "smoke\tools\ffmpeg\bin" | Out-Null
          Copy-Item $real.FullName "smoke\tools\ffmpeg\bin\"
          Copy-Item $probe "smoke\tools\ffmpeg\bin\"

          Push-Location smoke
          $env:Path = "C:\Windows\System32;C:\Windows"
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            throw "ffmpeg is still on PATH, so this test would prove nothing"
          }
          .\movie_summary_cli.exe 2>&1 | Tee-Object -FilePath ..\portable.log
          Pop-Location

          if (-not (Select-String -Path portable.log -Pattern "ffmpeg \+ ffprobe found" -Quiet)) {
            throw "the app did not pick up the portable FFmpeg from tools\ffmpeg\bin"
          }
          Write-Host "portable FFmpeg lookup OK (found tools\ffmpeg\bin with an empty PATH)"

      - name: Test the FFmpeg auto-installer (install_tools.ps1)
        shell: pwsh
        run: |
          # Really downloads and unpacks FFmpeg, exactly like run.bat does for a user.
          $dest = Join-Path (Get-Location) "ci-tools"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install_tools.ps1 -ToolsDir $dest
          if ($LASTEXITCODE -ne 0) { throw "install_tools.ps1 returned $LASTEXITCODE" }

          $ff = Join-Path $dest "ffmpeg\bin\ffmpeg.exe"
          $fp = Join-Path $dest "ffmpeg\bin\ffprobe.exe"
          if (-not (Test-Path $ff)) { throw "the installer did not produce ffmpeg.exe" }
          if (-not (Test-Path $fp)) { throw "the installer did not produce ffprobe.exe" }
          & $ff -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "the installed ffmpeg.exe does not run" }
          if (Test-Path (Join-Path $dest "downloads\ffmpeg.zip")) { throw "the zip was not cleaned up" }

          # a second run must be a no-op, not a second download
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install_tools.ps1 -ToolsDir $dest
          if ($LASTEXITCODE -ne 0) { throw "re-running install_tools.ps1 failed" }
          Write-Host "install_tools.ps1 OK -> $dest"

      - name: Test run.bat (finds the FFmpeg the installer put on disk)
        shell: pwsh
        run: |
          # Proves run.bat and install_tools.ps1 agree on the folder layout:
          # with no ffmpeg on PATH, run.bat must locate the portable copy.
          $env:Path = "C:\Windows\System32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          $env:MOVIECAP_TOOLS = Join-Path (Get-Location) "ci-tools"
          Write-Host "tools dir = $($env:MOVIECAP_TOOLS)"
          Write-Host "ffmpeg on PATH? $([bool](Get-Command ffmpeg -ErrorAction SilentlyContinue))"

          & cmd /c "run.bat setup" *> runbat.log
          $rc = $LASTEXITCODE
          Get-Content runbat.log | ForEach-Object { Write-Host "::notice title=runbat.log:: $_" }
          Write-Host "run.bat setup exit code: $rc"
          if ($rc -ne 0) { Write-Host "::error title=run.bat::run.bat setup exited with code $rc" }

          $hit = Select-String -Path runbat.log -Pattern "Using the portable FFmpeg" -Quiet
          if (-not $hit) { Write-Host "::error title=run.bat::run.bat did not report the portable FFmpeg" }
          if ($rc -ne 0 -or -not $hit) { exit 1 }
          Write-Host "run.bat OK"

      - name: Test run.bat with no F: drive (falls back to the app folder)
        shell: pwsh
        run: |
          # The runner has no F:, which is exactly the fallback case: the tools
          # must land in <app>\tools and run.bat must still find them.
          $env:Path = "C:\Windows\System32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          $env:MOVIECAP_TOOLS = "Z:\definitely-not-here\tools"
          if (Test-Path "tools\ffmpeg\bin") { Remove-Item -Recurse -Force "tools\ffmpeg" }

          & cmd /c "run.bat setup" *> runbat2.log
          $rc = $LASTEXITCODE
          Get-Content runbat2.log | ForEach-Object { Write-Host "::notice title=runbat2.log:: $_" }
          Write-Host "run.bat setup exit code: $rc"
          if ($rc -ne 0) { Write-Host "::error title=run.bat::the no-F: fallback exited with code $rc" }
          if (-not (Test-Path "tools\ffmpeg\bin\ffmpeg.exe")) {
            Write-Host "::error title=run.bat::nothing was installed into the app folder"
          }
          $hit = Select-String -Path runbat2.log -Pattern "Using the portable FFmpeg" -Quiet
          if (-not $hit) { Write-Host "::error title=run.bat::run.bat did not find the fallback copy" }
          if ($rc -ne 0 -or -not $hit -or -not (Test-Path "tools\ffmpeg\bin\ffmpeg.exe")) { exit 1 }
          Write-Host "no-F: fallback OK"

      - name: Smoke test the web control panel
        shell: pwsh
        run: |
          Copy-Item build\Release\movie_summary_web.exe smoke\
          $p = Start-Process -FilePath "smoke\movie_summary_web.exe" `
                 -ArgumentList "--host","127.0.0.1","--port","8123" `
                 -WorkingDirectory smoke -PassThru -WindowStyle Hidden
          try {
            $s = $null
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try { $s = Invoke-RestMethod "http://127.0.0.1:8123/api/status"; break } catch {}
            }
            if (-not $s) { throw "web UI never answered on /api/status" }
            if (-not $s.ffmpeg) { throw "web UI reports ffmpeg as missing" }

            $page = Invoke-WebRequest "http://127.0.0.1:8123/" -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "START GENERATION") {
              throw "control panel page is missing or incomplete"
            }

            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8123/api/config" `
              -ContentType "application/json" `
              -Body '{"open_api_key":"sk-fake","elevenlabs_api_key":"el-fake","min_clips":3}' | Out-Null
            $cfg = Invoke-RestMethod "http://127.0.0.1:8123/api/config"
            if ($cfg.min_clips -ne 3) { throw "config write did not stick" }
            if (-not $cfg.openai_key_set) { throw "API key was not saved" }

            # free / local narration engines must survive a round trip through config.json
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8123/api/config" `
              -ContentType "application/json" `
              -Body '{"tts_provider":"xtts","tts_base_url":"http://127.0.0.1:8020","tts_voice":"me.wav","tts_language":"en"}' | Out-Null
            $cfg = Invoke-RestMethod "http://127.0.0.1:8123/api/config"
            if ($cfg.tts_provider -ne "xtts") { throw "tts_provider write did not stick" }
            if ($cfg.tts_voice -ne "me.wav") { throw "tts_voice write did not stick" }
            if ($page.Content -notmatch "tts_provider") { throw "engine picker missing from the page" }
            Write-Host "TTS provider switch OK ($($cfg.tts_provider) / $($cfg.tts_base_url))"

            Set-Content -Path smoke\hello.srt -Value "1`n00:00:01,000 --> 00:00:02,000`nhi"
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8123/api/upload?dir=srt&name=hello.srt" `
              -InFile smoke\hello.srt -ContentType "text/plain" | Out-Null
            $list = Invoke-RestMethod "http://127.0.0.1:8123/api/list?dir=srt"
            if (-not ($list.files | Where-Object { $_.name -eq "hello.srt" })) { throw "upload failed" }

            $logs = Invoke-RestMethod "http://127.0.0.1:8123/api/logs?since=0"
            Write-Host "web UI smoke test OK ($($logs.lines.Count) log lines buffered)"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package
        shell: pwsh
        run: |
          $pkg = "AI-Movie-Shorts-Windows"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item build\Release\movie_summary_bot.exe, build\Release\movie_summary_cli.exe, build\Release\movie_summary_web.exe $pkg\
          Copy-Item -Recurse resources, backgroundmusic $pkg\
          Copy-Item config.json, README.md, run.bat, setup.ps1, install_tools.ps1 $pkg\
          Compress-Archive -Path $pkg\* -DestinationPath "$pkg.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Movie-Shorts-Windows
          path: AI-Movie-Shorts-Windows.zip

      - name: Publish to public release (direct download link)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-latest"
          $notes = "Ready-to-run Windows build (x64) from commit ${{ github.sha }}.`n`nNeeds FFmpeg: winget install Gyan.FFmpeg`nPut your API keys in config.json, then double-click run.bat."
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag AI-Movie-Shorts-Windows.zip --title "AI-Movie-Shorts for Windows (latest build)" --notes $notes --target ${{ github.sha }} --latest
          } else {
            gh release upload $tag AI-Movie-Shorts-Windows.zip --clobber
            gh release edit $tag --notes $notes
          }
