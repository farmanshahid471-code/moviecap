name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the zip to the public "windows-latest" release

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check the PowerShell installers
        shell: pwsh
        run: |
          # setup.ps1 is never executed in CI (it would install the ~4 GB C++
          # toolchain), so at least prove it parses.
          $bad = $false
          foreach ($f in @("setup.ps1", "install_tools.ps1", "install_piper.ps1")) {
            $errs = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $f), [ref]$null, [ref]$errs)
            if ($errs -and $errs.Count) {
              $bad = $true
              foreach ($e in $errs) {
                Write-Host "::error title=$f::$($e.Message) (line $($e.Extent.StartLineNumber))"
              }
            } else {
              Write-Host "$f parses OK"
            }
          }
          if ($bad) { exit 1 }

      - name: Build (MSVC, via build.bat)
        shell: pwsh
        run: |
          cmd /c "build.bat > build.log 2>&1"
          $code = $LASTEXITCODE
          Get-Content build.log -Tail 150
          if ($code -ne 0) {
            # Surface the compiler errors as annotations + job summary, so they
            # can be read without downloading the raw logs.
            $errs = Select-String -Path build.log -Pattern 'error|LINK :|fatal' |
                    Select-Object -First 12
            foreach ($e in $errs) {
              Write-Host ("::error title=MSVC build::{0}" -f $e.Line)
            }
            $fence = '```'
            Add-Content $env:GITHUB_STEP_SUMMARY "### MSVC build failed (exit $code)"
            Add-Content $env:GITHUB_STEP_SUMMARY $fence
            Select-String -Path build.log -Pattern 'error|LINK|fatal' |
              Select-Object -First 80 |
              ForEach-Object { Add-Content $env:GITHUB_STEP_SUMMARY $_.Line }
            Add-Content $env:GITHUB_STEP_SUMMARY $fence
            exit $code
          }

      - name: Unit tests (subtitles, captions, languages)
        shell: pwsh
        run: |
          # The log of a failed build step cannot be downloaded with gh, so every
          # step below turns the interesting lines into an annotation.
          # MSVC writes warnings to stderr: keep them from terminating the step.
          $ErrorActionPreference = 'Continue'
          function Show-Tail([string]$text, [string]$title) {
            $keep = ($text -split "`n" |
                     Where-Object { $_ -match 'error|Error|FAIL|failed|Test #|exception|Exception|assert' } |
                     Select-Object -First 25) -join ' ||| '
            if (-not $keep) { $keep = ($text -split "`n" | Select-Object -Last 25) -join ' ||| ' }
            if ($keep.Length -gt 12000) { $keep = $keep.Substring(0, 12000) }
            Write-Host ("::error title={0}::{1}" -f $title, $keep)
          }

          # Same build folder as build.bat, so the dependencies are already there.
          $cfg = & cmake -S . -B build -DBUILD_UNIT_TESTS=ON 2>&1 | Out-String
          Write-Host $cfg
          if ($LASTEXITCODE -ne 0) { Show-Tail $cfg "cmake configure"; exit 1 }

          $bld = & cmake --build build --config Release --target caption_language_test srt_structure_test anthropic_endpoint_test 2>&1 | Out-String
          Write-Host $bld
          if ($LASTEXITCODE -ne 0) { Show-Tail $bld "building the unit tests"; exit 1 }

          $run = & ctest --test-dir build -C Release --output-on-failure 2>&1 | Out-String
          Write-Host $run
          $code = $LASTEXITCODE
          $log = "build/Testing/Temporary/LastTest.log"
          if (Test-Path $log) {
            Select-String -Path $log -Pattern 'checks, \d+ failures' |
              ForEach-Object { Write-Host $_.Line }
          }
          if ($code -ne 0) {
            if (Test-Path $log) {
              Select-String -Path $log -Pattern '\[FAIL\]|FAILED|Assertion|Segmentation|abort' |
                Select-Object -First 15 |
                ForEach-Object { Write-Host ("::error title=Unit test::{0}" -f $_.Line) }
            }
            Show-Tail $run "unit tests failed"
            exit 1
          }

      - name: Install FFmpeg for smoke test
        shell: pwsh
        run: choco install ffmpeg -y --no-progress

      - name: Smoke test (unicode + apostrophe file name, fake keys)
        shell: pwsh
        run: |
          $env:Path = "C:\ProgramData\chocolatey\bin;" + $env:Path
          New-Item -ItemType Directory -Force smoke\movies | Out-Null
          Copy-Item build\Release\movie_summary_cli.exe smoke\
          Copy-Item -Recurse resources smoke\resources
          '{"open_api_key":"sk-fake","elevenlabs_api_key":"el-fake","auto_transcribe":false}' | Set-Content smoke\config.json
          ffmpeg -hide_banner -loglevel error -f lavfi -i testsrc=size=640x360:duration=60 -c:v libx264 "smoke\movies\Amélie's Test (2001).mp4"
          Push-Location smoke
          .\movie_summary_cli.exe 2>&1 | Tee-Object -FilePath ..\smoke.log
          $rc = $LASTEXITCODE
          Pop-Location
          Write-Host "exit code: $rc"
          if ($rc -ne 0) { throw "CLI returned $rc" }
          if (-not (Select-String -Path smoke.log -Pattern "Processing: Amélie's Test \(2001\)" -Quiet)) { throw "unicode movie was not picked up" }
          if (-not (Select-String -Path smoke.log -Pattern "All done" -Quiet)) { throw "run did not finish" }
          if (-not (Select-String -Path smoke.log -Pattern "NO REAL SUBTITLES" -Quiet)) { throw "no-subtitle placeholder warning did not run" }

          # With an unreachable API the app must NOT turn the raw subtitle lines
          # into the narration: no plan, no video, and the reason in the log.
          if (-not (Select-String -Path smoke.log -Pattern "skipping this movie instead of turning the raw subtitle lines" -Quiet)) {
            throw "the run did not refuse to narrate the raw subtitles"
          }
          if (Select-String -Path smoke.log -Pattern "offline planner = the narration will be RAW SUBTITLE LINES" -Quiet) {
            throw "the raw-subtitle fallback ran even though offline_planner is off"
          }
          if (Test-Path "smoke\output") {
            $made = @(Get-ChildItem "smoke\output" -Filter *.mp4 -ErrorAction SilentlyContinue)
            if ($made.Count -gt 0) { throw "a video was rendered from the raw subtitles" }
          }

          # The fallback is still there, but only when it is asked for.
          (Get-Content smoke\config.json) -replace '"open_api_key"', '"offline_planner":true,"open_api_key"' |
            Set-Content smoke\config.json
          Push-Location smoke
          .\movie_summary_cli.exe 2>&1 | Tee-Object -FilePath ..\smoke_offline.log
          $rc2 = $LASTEXITCODE
          Pop-Location
          if ($rc2 -ne 0) { throw "CLI returned $rc2 with offline_planner=true" }
          if (-not (Select-String -Path smoke_offline.log -Pattern "offline planner" -Quiet)) {
            throw "the local planner did not run with offline_planner=true"
          }

      - name: Test the portable FFmpeg lookup (nothing on PATH)
        shell: pwsh
        run: |
          # This is what makes the F: install work: run.bat drops ffmpeg.exe next to
          # the project instead of editing the system PATH, so the app has to find it.
          $real = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter ffmpeg.exe |
                  Select-Object -First 1
          if (-not $real) { throw "could not locate chocolatey's ffmpeg.exe to copy" }
          $probe = Join-Path $real.DirectoryName "ffprobe.exe"
          if (-not (Test-Path $probe)) { throw "ffprobe.exe is not next to ffmpeg.exe" }

          New-Item -ItemType Directory -Force "smoke\tools\ffmpeg\bin" | Out-Null
          Copy-Item $real.FullName "smoke\tools\ffmpeg\bin\"
          Copy-Item $probe "smoke\tools\ffmpeg\bin\"

          Push-Location smoke
          $env:Path = "C:\Windows\System32;C:\Windows"
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            throw "ffmpeg is still on PATH, so this test would prove nothing"
          }
          .\movie_summary_cli.exe 2>&1 | Tee-Object -FilePath ..\portable.log
          Pop-Location

          if (-not (Select-String -Path portable.log -Pattern "ffmpeg \+ ffprobe found" -Quiet)) {
            throw "the app did not pick up the portable FFmpeg from tools\ffmpeg\bin"
          }
          Write-Host "portable FFmpeg lookup OK (found tools\ffmpeg\bin with an empty PATH)"

      - name: Test the FFmpeg auto-installer (install_tools.ps1)
        shell: pwsh
        run: |
          # Really downloads and unpacks FFmpeg, exactly like run.bat does for a user.
          $dest = Join-Path (Get-Location) "ci-tools"
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install_tools.ps1 -ToolsDir $dest
          if ($LASTEXITCODE -ne 0) { throw "install_tools.ps1 returned $LASTEXITCODE" }

          $ff = Join-Path $dest "ffmpeg\bin\ffmpeg.exe"
          $fp = Join-Path $dest "ffmpeg\bin\ffprobe.exe"
          if (-not (Test-Path $ff)) { throw "the installer did not produce ffmpeg.exe" }
          if (-not (Test-Path $fp)) { throw "the installer did not produce ffprobe.exe" }
          & $ff -version | Select-Object -First 1
          if ($LASTEXITCODE -ne 0) { throw "the installed ffmpeg.exe does not run" }
          if (Test-Path (Join-Path $dest "downloads\ffmpeg.zip")) { throw "the zip was not cleaned up" }

          # a second run must be a no-op, not a second download
          powershell -NoProfile -ExecutionPolicy Bypass -File .\install_tools.ps1 -ToolsDir $dest
          if ($LASTEXITCODE -ne 0) { throw "re-running install_tools.ps1 failed" }
          Write-Host "install_tools.ps1 OK -> $dest"

      - name: Test run.bat (finds the FFmpeg the installer put on disk)
        shell: pwsh
        run: |
          # Proves run.bat and install_tools.ps1 agree on the folder layout:
          # with no ffmpeg on PATH, run.bat must locate the portable copy.
          $env:Path = "C:\Windows\System32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          $env:MOVIECAP_TOOLS = Join-Path (Get-Location) "ci-tools"
          Write-Host "tools dir = $($env:MOVIECAP_TOOLS)"
          Write-Host "ffmpeg on PATH? $([bool](Get-Command ffmpeg -ErrorAction SilentlyContinue))"

          & cmd /c "run.bat setup" *> runbat.log
          $rc = $LASTEXITCODE
          Get-Content runbat.log | ForEach-Object { Write-Host "::notice title=runbat.log:: $_" }
          Write-Host "run.bat setup exit code: $rc"
          if ($rc -ne 0) { Write-Host "::error title=run.bat::run.bat setup exited with code $rc" }

          $hit = Select-String -Path runbat.log -Pattern "Using the portable FFmpeg" -Quiet
          if (-not $hit) { Write-Host "::error title=run.bat::run.bat did not report the portable FFmpeg" }
          if ($rc -ne 0 -or -not $hit) { exit 1 }
          Write-Host "run.bat OK"

          # A placeholder voice file keeps the bare run from re-downloading Piper in CI.
          New-Item -ItemType Directory -Force "ci-tools\piper\voices" | Out-Null
          Set-Content "ci-tools\piper\voices\en_US-lessac-medium.onnx" "placeholder"

          # Bare double-click: must confirm the tools and start no exe at all.
          & cmd /c "run.bat" *> runbat-bare.log
          $rcb = $LASTEXITCODE
          Get-Content runbat-bare.log | ForEach-Object { Write-Host "::notice title=runbat-bare:: $_" }
          Write-Host "bare run.bat exit code: $rcb"
          $conf = Select-String -Path runbat-bare.log -Pattern "downloaded and installed" -Quiet
          $launched = Select-String -Path runbat-bare.log -Pattern "Initializing raylib" -Quiet
          if ($rcb -ne 0) { Write-Host "::error title=run.bat::bare run.bat exited with code $rcb" }
          if (-not $conf) { Write-Host "::error title=run.bat::bare run.bat did not confirm the tools" }
          if ($launched) { Write-Host "::error title=run.bat::bare run.bat started the app on its own" }
          if ($rcb -ne 0 -or -not $conf -or $launched) { exit 1 }
          Write-Host "bare run.bat OK - it confirms the tools and starts nothing"

      - name: "Test run.bat with no F drive (tools fall back to the app folder)"
        shell: pwsh
        run: |
          # The runner has no F:, which is exactly the fallback case: the tools
          # must land in <app>\tools and run.bat must still find them.
          $env:Path = "C:\Windows\System32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          $env:MOVIECAP_TOOLS = "Z:\definitely-not-here\tools"
          if (Test-Path "tools\ffmpeg\bin") { Remove-Item -Recurse -Force "tools\ffmpeg" }

          # First run: Z: does not exist, so the installer must fall back to <app>\tools.
          & cmd /c "run.bat setup" *> runbat2.log
          $rc1 = $LASTEXITCODE
          Write-Host "::notice title=install-run::exit=$rc1 ffmpeg=$(Test-Path 'tools\ffmpeg\bin\ffmpeg.exe') ffprobe=$(Test-Path 'tools\ffmpeg\bin\ffprobe.exe')"
          if ($rc1 -ne 0) { Write-Host "::error title=run.bat::the no-F: fallback exited with code $rc1" }
          if (-not (Test-Path "tools\ffmpeg\bin\ffmpeg.exe")) {
            Write-Host "::error title=run.bat::nothing was installed into the app folder"
          }

          # Second run: must find that copy on its own and must NOT download again.
          & cmd /c "run.bat setup" *> runbat3.log
          $rc2 = $LASTEXITCODE
          Get-Content runbat3.log | ForEach-Object { Write-Host "::notice title=second-run:: $_" }
          Write-Host "::notice title=second-run::exit=$rc2"

          $bad = $false
          if ($rc2 -ne 0) { Write-Host "::error title=run.bat::the second run exited with code $rc2"; $bad = $true }
          if (-not (Select-String -Path runbat3.log -Pattern "Using the portable FFmpeg" -Quiet)) {
            Write-Host "::error title=run.bat::the second run did not report the fallback copy"; $bad = $true
          }
          if (Select-String -Path runbat3.log -Pattern "Downloading" -Quiet) {
            Write-Host "::error title=run.bat::the second run downloaded FFmpeg again"; $bad = $true
          }
          if ($rc1 -ne 0 -or -not (Test-Path "tools\ffmpeg\bin\ffmpeg.exe") -or $bad) { exit 1 }
          Write-Host "no-F: fallback OK"

      - name: "Test run.bat from a folder with spaces and brackets"
        shell: pwsh
        run: |
          # The zip is usually extracted to something like "AI-Movie-Shorts-Windows (1)".
          # A ")" in the path breaks any unquoted expansion inside a parenthesised IF
          # block, and the installer must be told to use the folder run.bat will look in.
          $src = Join-Path $env:RUNNER_TEMP "AI-Movie-Shorts-Windows (1)"
          if (Test-Path $src) { Remove-Item -Recurse -Force $src }
          New-Item -ItemType Directory -Force $src | Out-Null
          Copy-Item run.bat, install_tools.ps1, install_piper.ps1 $src
          Copy-Item -Recurse resources (Join-Path $src "resources")

          $env:Path = "C:\Windows\System32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          Remove-Item Env:\MOVIECAP_TOOLS -ErrorAction SilentlyContinue
          $log = Join-Path $env:RUNNER_TEMP "brackets.log"

          # Phase 1: nothing is installed yet, so run.bat must install FFmpeg into the
          # very folder it checks afterwards.
          Push-Location $src
          & cmd /c "run.bat setup" *> $log
          $rc1 = $LASTEXITCODE
          Pop-Location
          $installed = Test-Path (Join-Path $src "tools\ffmpeg\bin\ffmpeg.exe")
          Write-Host "::notice title=brackets::phase1 exit=$rc1 installed=$installed"
          if ($rc1 -ne 0) { Write-Host "::error title=run.bat::run.bat setup failed inside a bracketed folder (exit $rc1)" }
          if (-not $installed) { Write-Host "::error title=run.bat::FFmpeg was not installed into the bracketed app folder" }

          # Phase 2: a second run must find it and must not download again.
          Push-Location $src
          & cmd /c "run.bat setup" *> "$log.2"
          $rc2 = $LASTEXITCODE
          Pop-Location
          Get-Content "$log.2" | ForEach-Object { Write-Host "::notice title=brackets2:: $_" }
          Write-Host "::notice title=brackets2::exit=$rc2"

          $bad = $false
          if ($rc1 -ne 0 -or -not $installed -or $rc2 -ne 0) { $bad = $true }
          if (-not (Select-String -Path "$log.2" -Pattern "Using the portable FFmpeg" -Quiet)) {
            Write-Host "::error title=run.bat::the second run did not find the portable FFmpeg"
            $bad = $true
          }
          if (Select-String -Path "$log.2" -Pattern "downloading a portable copy" -Quiet) {
            Write-Host "::error title=run.bat::the second run downloaded FFmpeg again"
            $bad = $true
          }
          if ($bad) {
            Get-Content $log | Select-Object -Last 15 | ForEach-Object { Write-Host "::notice title=brackets1:: $_" }
            exit 1
          }
          Write-Host "bracketed folder OK"

      - name: "Test the free Piper engine end to end (run.bat tts)"
        shell: pwsh
        run: |
          # Installs a private Python + piper-tts + a voice model, starts the real
          # server and asks it for audio. This is the whole free-narration path.
          $env:Path = "C:\Windows\System32;C:\Windows;C:\Windows\System32\WindowsPowerShell\v1.0"
          $tools = Join-Path (Get-Location) "ci-tools"
          $env:MOVIECAP_TOOLS = $tools
          Remove-Item -Recurse -Force (Join-Path $tools "piper") -ErrorAction SilentlyContinue

          & cmd /c "run.bat tts install" *> piper-install.log
          $rc = $LASTEXITCODE
          Get-Content piper-install.log | Select-Object -Last 12 | ForEach-Object { Write-Host "::notice title=piper-install:: $_" }
          Write-Host "::notice title=piper-install::exit=$rc"
          if ($rc -ne 0) { Write-Host "::error title=piper::run.bat tts install exited with code $rc" }

          $py   = Join-Path $tools "piper\python\python.exe"
          $onnx = Join-Path $tools "piper\voices\en_US-lessac-medium.onnx"
          if (-not (Test-Path $py))   { Write-Host "::error title=piper::no private python.exe was installed" }
          if (-not (Test-Path $onnx)) { Write-Host "::error title=piper::the voice model was not downloaded" }
          if ($rc -ne 0 -or -not (Test-Path $py) -or -not (Test-Path $onnx)) { exit 1 }

          $srv = Start-Process -FilePath $py -PassThru -WindowStyle Hidden `
                   -ArgumentList "-m","piper.http_server","--host","127.0.0.1","--port","5099","-m","en_US-lessac-medium","--data-dir","$tools\piper\voices" `
                   -RedirectStandardError piper-err.log -RedirectStandardOutput piper-out.log
          try {
            $up = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Seconds 2
              try { Invoke-WebRequest "http://127.0.0.1:5099/" -UseBasicParsing -TimeoutSec 5 | Out-Null; $up = $true; break } catch {}
            }
            if (-not $up) {
              Get-Content piper-err.log -Tail 20 | ForEach-Object { Write-Host "::notice title=piper-server:: $_" }
              Write-Host "::error title=piper::the server never answered on /"
              exit 1
            }

            Invoke-WebRequest -Method Post -Uri "http://127.0.0.1:5099/synthesize" `
              -ContentType "application/json" -Body '{"text":"Hello from the free narration engine."}' `
              -OutFile piper.wav -UseBasicParsing -TimeoutSec 300
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path piper.wav))
            $hdr = [System.Text.Encoding]::ASCII.GetString($bytes[0..3])
            Write-Host "::notice title=piper::/synthesize returned $($bytes.Length) bytes, header=$hdr"
            if ($bytes.Length -lt 5000 -or $hdr -ne "RIFF") {
              Write-Host "::error title=piper::/synthesize did not return WAV audio"
              exit 1
            }
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Piper end to end OK"

          # Full FREE generation: Piper selected, no server running, no working
          # OpenAI key, and "offline_planner": true (the opt-in free path - by
          # default a run with no AI plan is skipped, see the smoke test above).
          # The app must auto-start the Piper server it just installed, and the
          # fallback subtitles plus the local planner must carry the run all the
          # way to a finished video of the requested length.
          $free = Join-Path (Get-Location) "pfree"
          New-Item -ItemType Directory -Force "$free\movies" | Out-Null
          Copy-Item build\Release\movie_summary_cli.exe $free\
          Copy-Item -Recurse resources $free\resources
          '{"open_api_key":"sk-fake","tts_provider":"piper","min_clips":2,"max_clips":2,"recap_minutes":1,"offline_planner":true}' | Set-Content "$free\config.json"
          # Dense synthetic SRT whose lines torture the caption escaping
          # (apostrophe, colon, comma, brackets, percent) so a regression in
          # drawtext escaping fails the build instead of the user's video.
          New-Item -ItemType Directory -Force "$free\scripts\srt_files" | Out-Null
          $lines = @()
          $idx = 1
          for ($t = 0; $t -lt 58; $t += 1) {
            $lines += "$idx"
            $lines += ("00:00:{0:D2},000 --> 00:00:{1:D2},000" -f $t, ($t + 1))
            $lines += "Scene $t it's a test, and the story moves forward: yes [really] 100%."
            $lines += ""
            $idx++
          }
          ($lines -join "`r`n") | Set-Content "$free\scripts\srt_files\Free Run 2026 1080p.srt"
          & "C:\ProgramData\chocolatey\bin\ffmpeg.exe" -hide_banner -loglevel error -f lavfi `            -i testsrc=size=640x360:duration=60 -c:v libx264 "$free\movies\Free Run (2026).mp4"
          $env:Path = "C:\ProgramData\chocolatey\bin;C:\Windows\System32;C:\Windows"
          Push-Location $free
          .\movie_summary_cli.exe 2>&1 | Tee-Object -FilePath ..\pfree.log
          $rc = $LASTEXITCODE
          Pop-Location
          $tail = (Get-Content pfree.log -Tail 14) -join " ||| "
          Write-Host "::warning title=pfree-tail::$tail"
          Write-Host "pfree exit code: $rc"
          if ($rc -ne 0) {
            Write-Host "::error title=pfree::cli exited $rc"; exit 1 }
          if (-not (Select-String -Path pfree.log -Pattern "Piper server started automatically" -Quiet)) {
            Write-Host "::error title=pfree::the app did not auto-start the Piper server"; exit 1 }
          if (-not (Select-String -Path pfree.log -Pattern "Matched a subtitle file" -Quiet)) {
            Write-Host "::error title=pfree::fuzzy SRT matching did not find the subtitle file"; exit 1 }
          if (-not (Select-String -Path pfree.log -Pattern "Processed: 1" -Quiet)) {
            Write-Host "::error title=pfree::the free keyless generation did not finish"; exit 1 }
          if (-not (Select-String -Path pfree.log -Pattern "Target recap length" -Quiet)) {
            Write-Host "::error title=pfree::recap_minutes target was not applied"; exit 1 }
          $m = Select-String -Path pfree.log -Pattern "Final duration: ([0-9.]+) seconds"
          if (-not $m) { Write-Host "::error title=pfree::no final duration in log"; exit 1 }
          $dur = [double]$m.Matches[0].Groups[1].Value
          Write-Host "pfree final duration: $dur s (target ~60 s)"
          if ($dur -lt 40) {
            Write-Host "::error title=pfree::recap collapsed to $dur s - the length target is broken"; exit 1 }

          # Burnt-in captions: the log lists every caption chunk in the order it
          # appears, with the seconds it is on screen and the rows its lines were
          # drawn in. Inside one chunk the FIRST line must be drawn ABOVE the
          # second (rows must count down), the chunks must run forward in time and
          # the first chunk of a clip must start at the start of the narration -
          # that is exactly the "it shows the next sentence before the present
          # sentence" bug. The clips only exist if ffmpeg accepted the whole
          # drawtext chain, so this covers the escaping too.
          $lastEnd = -1.0
          $chunks = 0
          $capsSeen = 0
          foreach ($line in (Get-Content pfree.log)) {
            if ($line -match 'Building clip \d+:') { $lastEnd = -1.0; continue }
            $cm = [regex]::Match($line, 'Captions: \d+ chunk\(s\) \| (.*)$')
            if (-not $cm.Success) { continue }
            $body = $cm.Groups[1].Value
            if ($capsSeen -eq 0 -and $body -notmatch '[0-9]+\.[0-9]+-[0-9]+\.[0-9]+s rows\[[0-9,]+\] "Scene ') {
              Write-Host "::error title=captions::the first caption does not start at the start of the narration: $body"
              exit 1
            }
            $capsSeen++
            foreach ($w in [regex]::Matches($body, '([0-9.]+)-([0-9.]+)s rows\[([0-9,]+)\]')) {
              $t0 = [double]$w.Groups[1].Value
              $t1 = [double]$w.Groups[2].Value
              if ($t0 -lt $lastEnd - 0.02) {
                Write-Host "::error title=captions::caption windows go backwards ($t0 s starts before the previous chunk ended at $lastEnd s)"
                exit 1
              }
              $lastEnd = $t1
              $rows = $w.Groups[3].Value.Split(',')
              for ($r = 1; $r -lt $rows.Count; $r++) {
                if ([int]$rows[$r] -ge [int]$rows[$r - 1]) {
                  Write-Host "::error title=captions::caption lines are stacked in the wrong order (rows $($w.Groups[3].Value)) - the lower line would be read first"
                  exit 1
                }
              }
              $chunks++
            }
          }
          if ($capsSeen -eq 0) { Write-Host "::error title=captions::no caption line in the log"; exit 1 }
          Write-Host "captions OK: $chunks chunks in speech order, first line of every multi-line chunk drawn on top"
          Write-Host "free keyless generation OK (auto-started Piper, fallback SRT, local plan, captions)"

      - name: "Test batch planning end to end (Anthropic Message Batches)"
        shell: pwsh
        run: |
          # The batch path is the 50%-cheaper one: every plan request is
          # collected, submitted as ONE Message Batch, waited for, and the
          # videos are rendered from those results.  The mock API implements
          # /anthropic/v1/messages/batches (create, status, results), so this
          # covers the whole thing: both passes of the movie loop, the polling,
          # the JSONL results parsing and the final video.
          $ErrorActionPreference = 'Continue'
          $pb = Join-Path (Get-Location) "pbatch"
          New-Item -ItemType Directory -Force "$pb\movies" | Out-Null
          New-Item -ItemType Directory -Force "$pb\scripts\srt_files" | Out-Null
          Copy-Item build\Release\movie_summary_cli.exe $pb\
          Copy-Item -Recurse resources $pb\resources
          # Claude via the Anthropic-compatible path, batch planning on.
          '{"open_api_key":"sk-ant-mock","openai_base_url":"http://127.0.0.1:9100/anthropic","openai_model":"claude-sonnet-4-5","tts_provider":"piper","min_clips":2,"max_clips":2,"recap_minutes":1,"batch_planning":true,"batch_max_wait_minutes":5,"use_wikipedia_plot":false,"auto_transcribe":false}' | Set-Content "$pb\config.json"
          $lines = @()
          $idx = 1
          for ($t = 0; $t -lt 58; $t += 2) {
            $lines += "$idx"
            $lines += ("00:00:{0:D2},000 --> 00:00:{1:D2},000" -f $t, ($t + 2))
            $lines += "Scene $t - the story moves forward here."
            $lines += ""
            $idx++
          }
          ($lines -join "`r`n") | Set-Content "$pb\scripts\srt_files\Batch Run 2026 1080p.srt"
          & "C:\ProgramData\chocolatey\bin\ffmpeg.exe" -hide_banner -loglevel error -f lavfi -i testsrc=size=640x360:duration=60 -c:v libx264 "$pb\movies\Batch Run (2026).mp4"
          if ($LASTEXITCODE -ne 0) { throw "ffmpeg could not build the test movie" }

          $srv = Start-Process -FilePath "python" `
            -ArgumentList "tools/mock_api_server.py","--openai-port","9100","--eleven-port","9101","--tts-port","8020" `
            -PassThru -RedirectStandardOutput "mockbatch.log" -RedirectStandardError "mockbatch.err"
          Start-Sleep -Seconds 4
          try {
            $env:Path = "C:\ProgramData\chocolatey\bin;C:\Windows\System32;C:\Windows"
            Push-Location $pb
            .\movie_summary_cli.exe 2>&1 | Tee-Object -FilePath ..\pbatch.log
            $rc = $LASTEXITCODE
            Pop-Location
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }
          $tail = (Get-Content pbatch.log -Tail 12) -join " ||| "
          Write-Host "::warning title=pbatch-tail::$tail"
          if ($rc -ne 0) { Write-Host "::error title=pbatch::cli exited $rc"; exit 1 }

          if (-not (Select-String -Path pbatch.log -Pattern "Batch planning is ON" -Quiet)) {
            Write-Host "::error title=pbatch::batch mode was not enabled"; exit 1 }
          if (-not (Select-String -Path pbatch.log -Pattern "Submitting 1 plan request" -Quiet)) {
            Write-Host "::error title=pbatch::the collected request was not submitted as a batch"; exit 1 }
          if (-not (Select-String -Path pbatch.log -Pattern "Queued for the batch" -Quiet)) {
            Write-Host "::error title=pbatch::the collecting pass did not queue the plan"; exit 1 }
          if (-not (Select-String -Path pbatch.log -Pattern "Batch msgbatch_mock.* submitted" -Quiet)) {
            Write-Host "::error title=pbatch::no batch was created"; exit 1 }
          if (-not (Select-String -Path pbatch.log -Pattern "ended: 1 succeeded" -Quiet)) {
            Write-Host "::error title=pbatch::the batch never finished"; exit 1 }
          if (-not (Select-String -Path pbatch.log -Pattern "Using the batched plan for" -Quiet)) {
            Write-Host "::error title=pbatch::the rendering pass did not use the batched plan"; exit 1 }
          if (-not (Select-String -Path pbatch.log -Pattern "All done. Processed: 1" -Quiet)) {
            Write-Host "::error title=pbatch::the run did not finish"; exit 1 }
          # The batched plan must satisfy the length target on its own: the audit
          # asking for longer narrations would mean the batch produced a shorter
          # recap than the live path would have.
          if (Select-String -Path pbatch.log -Pattern "asking the model once more for full-length" -Quiet) {
            Write-Host "::error title=pbatch::the batched plan was too short - the length audit had to top it up"
            exit 1 }
          if (Select-String -Path pbatch.log -Pattern "came back in the wrong language" -Quiet) {
            Write-Host "::error title=pbatch::the batched plan came back in the wrong language"; exit 1 }

          # The plan really came from the batch: no live plan call was made
          # (the mock prints "returning N clips" for a live /responses request).
          if (Select-String -Path mockbatch.err -Pattern "returning \d+ clips" -Quiet) {
            Write-Host "::error title=pbatch::a LIVE plan request was made - the batch was bypassed"
            exit 1 }
          if (-not (Select-String -Path mockbatch.err -Pattern "created with 1 request" -Quiet)) {
            Write-Host "::error title=pbatch::the mock never received a batch create call"; exit 1 }

          # The result file and the manifest are on disk, with the real script.
          $manifest = Get-Content "$pb\scripts\plans\batch_state.json" | ConvertFrom-Json
          if ($manifest.status -ne "fetched") {
            Write-Host "::error title=pbatch::the batch manifest is not marked as fetched ($($manifest.status))"
            exit 1 }
          if (-not (Select-String -Path "$pb\scripts\plans\*.result.json" -Pattern "don't forget to like the video" -Quiet)) {
            Write-Host "::error title=pbatch::the batched plan does not carry the closing line"; exit 1 }

          $vid = Get-Item "$pb\output\Batch Run (2026).mp4" -ErrorAction SilentlyContinue
          if (-not $vid) { Write-Host "::error title=pbatch::no video was rendered"; exit 1 }
          $dur = & "C:\ProgramData\chocolatey\bin\ffprobe.exe" -v error -show_entries format=duration -of csv=p=0 "$pb\output\Batch Run (2026).mp4"
          Write-Host "pbatch video: $($vid.Length) bytes, $dur s"
          if ([double]$dur -lt 40) {
            Write-Host "::error title=pbatch::the batched recap collapsed to $dur s"; exit 1 }
          Write-Host "batch planning OK: 1 request batched, results fetched, video rendered from the batched plan"

      - name: "Test run.bat web brings the control panel up"
        shell: pwsh
        run: |
          # Exercises the run.bat launch path end to end: tools resolution, the
          # exe lookup and the PATH injection the app relies on.
          Copy-Item run.bat smoke\
          Copy-Item build\Release\movie_summary_web.exe smoke\
          $env:Path = "C:\ProgramData\chocolatey\bin;C:\Windows\System32;C:\Windows"
          $p = Start-Process -FilePath "cmd.exe" -ArgumentList '/c','run.bat web --port 8124' `
                 -WorkingDirectory smoke -PassThru -WindowStyle Hidden
          try {
            $ok = $false
            for ($i = 0; $i -lt 60; $i++) {
              Start-Sleep -Milliseconds 500
              try {
                $r = Invoke-WebRequest "http://127.0.0.1:8124/api/status" -UseBasicParsing -TimeoutSec 5
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) {
              Write-Host "::error title=run.bat::run.bat web did not bring the panel up on port 8124"
              exit 1
            }
            Write-Host "run.bat web OK - the panel answered on 8124"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Get-Process movie_summary_web -ErrorAction SilentlyContinue |
              Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Test the AI extras (edge-tts + faster-whisper)
        shell: pwsh
        run: |
          $env:Path = "C:\ProgramData\chocolatey\bin;" + $env:Path
          $py = "ci-tools\piper\python\python.exe"
          if (-not (Test-Path $py)) { Write-Host "::error title=extras::bundled python missing at $py"; exit 1 }
          $o = (& $py -m pip install --no-warn-script-location --disable-pip-version-check edge-tts faster-whisper==1.1.1 requests "av>=15" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { $f = ($o -replace "\r?\n", " ||| "); Write-Host "::error title=extras::pip install failed (exit $LASTEXITCODE): $($f.Substring([Math]::Max(0,$f.Length-600)))"; exit 1 }
          $o = (& $py -c "import edge_tts, faster_whisper, ctranslate2; print('imports OK', ctranslate2.__version__)" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { $f = ($o -replace "\r?\n", " ||| "); Write-Host "::error title=extras::import failed: $($f.Substring([Math]::Max(0,$f.Length-700)))"; exit 1 }
          $o = (& $py -c "from huggingface_hub import snapshot_download; p=snapshot_download('Systran/faster-whisper-tiny', cache_dir='ci-tools/hf-cache'); print('snapshot OK', p)" 2>&1 | Out-String)
          Write-Host $o
          if ($LASTEXITCODE -ne 0) { $f = ($o -replace "\r?\n", " ||| "); Write-Host "::error title=extras::model download failed: $($f.Substring([Math]::Max(0,$f.Length-700)))"; exit 1 }
          $o = (& $py -c "import glob, ctranslate2; d=glob.glob('ci-tools/hf-cache/models--Systran--faster-whisper-tiny/snapshots/*')[0]; m=ctranslate2.models.Whisper(d); print('ct2 load OK')" 2>&1 | Out-String)
          Write-Host $o
          if ($LASTEXITCODE -ne 0) { $f = ($o -replace "\r?\n", " ||| "); Write-Host "::error title=extras::ctranslate2 load failed: $($f.Substring([Math]::Max(0,$f.Length-700)))"; exit 1 }
          ffmpeg -y -hide_banner -loglevel error -f lavfi -i "sine=frequency=440:duration=6" -ar 16000 -ac 1 extras_audio.wav
          if (-not (Test-Path extras_audio.wav)) { Write-Host "::error title=extras::ffmpeg did not produce the test audio"; exit 1 }
          & $py whisper_transcribe.py --model tiny --audio extras_audio.wav --out extras.srt --cache-dir ci-tools\hf-cache *> whisper_run.txt
          $wexit = $LASTEXITCODE
          $wout = (Get-Content whisper_run.txt -Raw)
          Write-Host $wout
          if ($wexit -ne 0) { $f = ($wout -replace "\r?\n", " ||| "); Write-Host "::error title=extras::whisper_transcribe failed (exit $wexit): $($f.Substring([Math]::Max(0,$f.Length-800)))"; exit 1 }
          if (-not (Test-Path extras.srt)) { Write-Host "::error title=extras::no SRT was produced"; exit 1 }
          Write-Host "AI extras OK (edge-tts importable, faster-whisper produced an SRT)"

      - name: Smoke test the web control panel
        shell: pwsh
        run: |
          Copy-Item build\Release\movie_summary_web.exe smoke\
          $p = Start-Process -FilePath "smoke\movie_summary_web.exe" `
                 -ArgumentList "--host","127.0.0.1","--port","8123" `
                 -WorkingDirectory smoke -PassThru -WindowStyle Hidden
          try {
            $s = $null
            for ($i = 0; $i -lt 40; $i++) {
              Start-Sleep -Milliseconds 500
              try { $s = Invoke-RestMethod "http://127.0.0.1:8123/api/status"; break } catch {}
            }
            if (-not $s) { throw "web UI never answered on /api/status" }
            if (-not $s.ffmpeg) { throw "web UI reports ffmpeg as missing" }

            $page = Invoke-WebRequest "http://127.0.0.1:8123/" -UseBasicParsing
            if ($page.StatusCode -ne 200 -or $page.Content -notmatch "START GENERATION") {
              throw "control panel page is missing or incomplete"
            }

            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8123/api/config" `
              -ContentType "application/json" `
              -Body '{"open_api_key":"sk-fake","elevenlabs_api_key":"el-fake","min_clips":3}' | Out-Null
            $cfg = Invoke-RestMethod "http://127.0.0.1:8123/api/config"
            if ($cfg.min_clips -ne 3) { throw "config write did not stick" }
            if (-not $cfg.openai_key_set) { throw "API key was not saved" }

            # free / local narration engines must survive a round trip through config.json
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8123/api/config" `
              -ContentType "application/json" `
              -Body '{"tts_provider":"xtts","tts_base_url":"http://127.0.0.1:8020","tts_voice":"me.wav","tts_language":"en"}' | Out-Null
            $cfg = Invoke-RestMethod "http://127.0.0.1:8123/api/config"
            if ($cfg.tts_provider -ne "xtts") { throw "tts_provider write did not stick" }
            if ($cfg.tts_voice -ne "me.wav") { throw "tts_voice write did not stick" }
            if ($page.Content -notmatch "tts_provider") { throw "engine picker missing from the page" }
            if ($page.Content -notmatch "recap_languages") { throw "recap languages hint missing from the page" }
            if ($page.Content -notmatch "lang_zh") { throw "language checkboxes missing from the page" }
            if ($page.Content -notmatch "caption_font_zh") { throw "per-language caption font fields missing from the page" }
            Write-Host "TTS provider switch OK ($($cfg.tts_provider) / $($cfg.tts_base_url))"

            Set-Content -Path smoke\hello.srt -Value "1`n00:00:01,000 --> 00:00:02,000`nhi"
            Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8123/api/upload?dir=srt&name=hello.srt" `
              -InFile smoke\hello.srt -ContentType "text/plain" | Out-Null
            $list = Invoke-RestMethod "http://127.0.0.1:8123/api/list?dir=srt"
            if (-not ($list.files | Where-Object { $_.name -eq "hello.srt" })) { throw "upload failed" }

            $logs = Invoke-RestMethod "http://127.0.0.1:8123/api/logs?since=0"
            Write-Host "web UI smoke test OK ($($logs.lines.Count) log lines buffered)"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package
        shell: pwsh
        run: |
          $pkg = "AI-Movie-Shorts-Windows"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item build\Release\movie_summary_bot.exe, build\Release\movie_summary_cli.exe, build\Release\movie_summary_web.exe $pkg\
          Copy-Item -Recurse resources, backgroundmusic $pkg\
          Copy-Item config.json, README.md, run.bat, setup.ps1, install_tools.ps1, install_piper.ps1 $pkg\
          Copy-Item edge_tts_synth.py, whisper_transcribe.py $pkg\
          Compress-Archive -Path $pkg\* -DestinationPath "$pkg.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: AI-Movie-Shorts-Windows
          path: AI-Movie-Shorts-Windows.zip

      - name: Publish to public release (direct download link)
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "windows-latest"
          $notes = "Ready-to-run Windows build (x64) from commit ${{ github.sha }}.`n`nDouble-click run.bat: it downloads every required tool (portable, kept off C:), confirms the install and stops.`nThen open movie_summary_web.exe yourself (browser panel, needs no graphics card) or movie_summary_bot.exe (desktop window, needs OpenGL 3.3).`nAPI keys go in config.json or into the panel."
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag AI-Movie-Shorts-Windows.zip --title "AI-Movie-Shorts for Windows (latest build)" --notes $notes --target ${{ github.sha }} --latest
          } else {
            gh release upload $tag AI-Movie-Shorts-Windows.zip --clobber
            gh release edit $tag --notes $notes
          }
